name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v1.0.0). Without one only the artifact is produced."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build the Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            '${{ inputs.tag }}'
          }
          if (-not $tag) { $tag = 'v0.0.0-dev' }
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Tag: $tag / version: $version"

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $declared = (uv run hymacro --version) -replace '^HyMacro\s+', ''
          $expected = '${{ steps.version.outputs.version }}'
          if ($declared.Trim() -ne $expected) {
            Write-Error "The tag says $expected but the package reports $declared. Update pyproject.toml and src/hymacro/__init__.py."
            exit 1
          }
          Write-Host "Version verified: $declared"

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/hymacro.spec --noconfirm --clean

      - name: Assemble the package
        shell: pwsh
        run: |
          Copy-Item config.json  dist/HyMacro/config.json
          Copy-Item README.md    dist/HyMacro/README.md
          Copy-Item LICENSE      dist/HyMacro/LICENSE.txt
          Get-ChildItem dist/HyMacro | Select-Object Name, Length

      - name: Check the executable starts
        shell: pwsh
        run: |
          & dist/HyMacro/HyMacro.exe --check
          if ($LASTEXITCODE -ne 0) { Write-Error "The executable failed to validate the configuration"; exit 1 }

      - name: Compress and checksum
        id: package
        shell: pwsh
        run: |
          $name = "HyMacro-${{ steps.version.outputs.tag }}-windows-x64"
          Compress-Archive -Path dist/HyMacro/* -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "$name.zip.sha256" -Encoding ascii
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SHA256: $hash"

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: HyMacro ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
          body: |
            ## Install

            1. Download and extract `${{ steps.package.outputs.name }}.zip`.
            2. Run `HyMacro.exe`. Right click and **Run as administrator** if the
               hotkeys do not respond: global keyboard hooks need it when
               Minecraft itself runs elevated.
            3. Adjust timings and hotkeys from **Settings** inside the app.

            ## Notes

            - **Windows SmartScreen will warn you.** The executable is not code
              signed. Choose "More info" then "Run anyway".
            - **Your antivirus may flag it.** A binary that installs a global
              keyboard hook looks like a keylogger to heuristic scanners. The
              source is in this repository and this workflow builds it in the open.
            - Verify the download with the attached `.sha256`:
              ```
              Get-FileHash ${{ steps.package.outputs.name }}.zip -Algorithm SHA256
              ```
            - Automating gameplay may go against the Hypixel rules. Use at your
              own risk.
