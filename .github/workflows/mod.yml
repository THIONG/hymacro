name: Mod

on:
  push:
    branches: [main]
    paths:
      - "mod/**"
      - ".github/workflows/mod.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Fabric jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        working-directory: mod
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon build 2>&1 | tee ../mod-build.log

      # Actions logs cannot be read without a token, so the outcome is written
      # back into the repository where it can be fetched over plain HTTP.
      - name: Publish the build report
        run: |
          mkdir -p mod/reports
          {
            echo "outcome: ${{ steps.build.outcome }}"
            echo "commit: ${{ github.sha }}"
            echo "----"
            if [ -f mod-build.log ]; then
              grep -E "error:|FAILURE|Caused by|Could not|Unresolved|cannot find symbol|^> " mod-build.log \
                | head -n 120 || true
              echo "----"
              tail -n 60 mod-build.log
            else
              echo "no build log was produced"
            fi
          } > mod/reports/last-build.txt
          ls -la mod/build/libs 2>/dev/null >> mod/reports/last-build.txt || true

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod/reports/last-build.txt
          git diff --staged --quiet || git commit -m "ci: mod build report [skip ci]"
          git push

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: hymacro-mod
          path: mod/build/libs/*.jar
          retention-days: 30
